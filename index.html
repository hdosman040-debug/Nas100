<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forex Journal Pro</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- TradingView Lightweight Charts Library -->
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.umd.js"></script>
    <style>
        /* Telegram Theme Variables and Basic Styling */
        :root {
            --bg: var(--tg-theme-bg-color, #1a1a1a);
            --text: var(--tg-theme-text-color, #f0f0f0);
            --hint: var(--tg-theme-hint-color, #777777);
            --btn: var(--tg-theme-button-color, #007bff);
            --btn-text: var(--tg-theme-button-text-color, #ffffff);
            --link: var(--tg-theme-link-color, #007bff);
            --secondary-bg: var(--tg-theme-secondary-bg-color, #2a2a2a);
        }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            padding: 15px; 
            margin: 0; 
            line-height: 1.6;
        }
        h2, h3 { color: var(--text); border-bottom: 1px solid var(--hint); padding-bottom: 5px; margin-top: 25px; margin-bottom: 15px; }
        .card { 
            background: var(--secondary-bg); 
            padding: 15px; 
            border-radius: 12px; 
            margin-bottom: 20px; 
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 0.9em; color: var(--hint); }
        input[type="text"], input[type="number"], select { 
            width: 100%; 
            padding: 10px; 
            margin: 5px 0 15px; 
            border-radius: 8px; 
            border: 1px solid var(--hint); 
            background: var(--bg); 
            color: var(--text); 
            box-sizing: border-box;
        }
        button { 
            width: 100%; 
            padding: 12px; 
            background: var(--btn); 
            color: var(--btn-text); 
            border: none; 
            border-radius: 8px; 
            font-weight: bold; 
            cursor: pointer; 
            font-size: 1.05em;
            transition: background-color 0.2s ease;
        }
        button:hover {
            background-color: color-mix(in srgb, var(--btn) 80%, white);
        }
                .trade-item { 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            padding: 10px 0; 
            border-bottom: 1px dashed var(--hint); 
            font-size: 0.95em;
        }
        .trade-item:last-child { border-bottom: none; }
        .profit { color: #4caf50; font-weight: bold; } /* Green */
        .loss { color: #f44336; font-weight: bold; }   /* Red */
        .neutral { color: var(--hint); }
        .current-price { font-size: 1.2em; font-weight: bold; margin-bottom: 10px; text-align: center; }
        .progress-bar-container { background: var(--bg); border-radius: 5px; height: 10px; margin-top: 10px; overflow: hidden; }
        .progress-bar { height: 100%; background: #4caf50; width: 0%; border-radius: 5px; transition: width 0.5s ease-in-out; }
        .goal-status { text-align: center; font-size: 0.9em; margin-top: 5px; color: var(--hint); }
        .risk-output { margin-top: 15px; padding: 10px; background: var(--bg); border-radius: 8px; border: 1px solid var(--hint); text-align: center; }
        #chart-container { height: 250px; background: var(--bg); border-radius: 8px; margin-top: 15px; }
    </style>
</head>
<body>

    <!-- Telegram SDK Initialization and Main Button -->
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.MainButton.text = "Close App";
        tg.MainButton.show();
        tg.MainButton.onClick(() => {
            tg.close();
        });

        // Use Telegram theme parameters
        document.documentElement.style.setProperty('--bg', tg.themeParams.bg_color || '#1a1a1a');
        document.documentElement.style.setProperty('--text', tg.themeParams.text_color || '#f0f0f0');
        document.documentElement.style.setProperty('--hint', tg.themeParams.hint_color || '#777777');
        document.documentElement.style.setProperty('--btn', tg.themeParams.button_color || '#007bff');
        document.documentElement.style.setProperty('--btn-text', tg.themeParams.button_text_color || '#ffffff');
        document.documentElement.style.setProperty('--link', tg.themeParams.link_color || '#007bff');

                document.documentElement.style.setProperty('--secondary-bg', tg.themeParams.secondary_bg_color || '#2a2a2a');
    </script>

    <h2>📊 Trading Dashboard</h2>

    <!-- Feature 1: Live Price Feed (NAS100) -->
    <h3>Live Price <span id="current-instrument">NAS100</span></h3>
    <div class="card">
        <p class="current-price" id="nas100-price">Fetching...</p>
        <p class="goal-status">Next update in <span id="price-countdown">10</span>s</p>
    </div>

    <!-- Feature 2: Daily Goal Progress -->
    <h3>Daily Goal Tracker</h3>
    <div class="card">
        <label for="daily-goal-input">Daily Profit Goal ($)</label>
        <input type="number" id="daily-goal-input" value="100" onchange="updateDailyGoal()">
        <p class="goal-status">Today: <span id="today-profit">$0</span> / <span id="current-goal">$100</span></p>
        <div class="progress-bar-container">
            <div class="progress-bar" id="daily-progress-bar"></div>
        </div>
    </div>

    <!-- Feature 3: Risk Calculator -->
    <h3>Risk Calculator</h3>
    <div class="card">
        <label for="account-balance">Account Balance ($)</label>
        <input type="number" id="account-balance" value="1000">

        <label for="risk-percentage">Risk per Trade (%)</label>
        <input type="number" id="risk-percentage" value="1">

        <label for="stop-loss-pips">Stop Loss (Pips)</label>
        <input type="number" id="stop-loss-pips" value="10">

        <label for="

            pip-value-per-lot">Pip Value per Lot ($)</label>
        <input type="number" id="pip-value-per-lot" value="10"> <!-- Standard $10 for 1 standard lot EURUSD -->

        <button onclick="calculateLotSize()">Calculate Lot Size</button>
        <div class="risk-output" id="lot-size-output">
            Calculated Lot Size: <span class="profit" id="calculated-lot">0.00</span>
        </div>
    </div>

    <!-- Feature 4: Simple Chart (TradingView Lightweight Charts) -->
    <h3>NAS100 Performance (Mock Data)</h3>
    <div class="card">
        <div id="chart-container"></div>
        <p class="goal-status"><i>(Real-time data integration for charts requires a backend or advanced API setup)</i></p>
    </div>

    <h3>📈 New Trade</h3>
    <div class="card">
        <label for="pair">Pair</label>
        <input type="text" id="pair" placeholder="e.g. NAS100 or EURUSD">
        
        <label for="result">Result ($)</label>
        <input type="number" id="result" placeholder="e.g. 50 or -20">
        
        <button onclick="saveTrade()">Log Trade</button>
    </div>

    <h3>📜 History</h3>
    <div class="card" id="history">
        <!-- Trade history will be displayed here -->
    </div>

    <script>
        // --- Configuration & Global Variables ---
        const API_KEY_ALPHAVANTAGE = 'YOUR_ALPHAVANTAGE_API_KEY'; // Get yours at https://www.alphavantage.co/support/#api-key
        const API_KEY_FINANCIALMODELINGPREP = 'YOUR_FMP_API_KEY'; // Get yours at https://site.financialmodelingprep.com/developer/docs/
        const REFRESH_INTERVAL_SECONDS = 10;
        let priceCountdown = REFRESH_INTERVAL_SECONDS;
        let priceRefreshInterval;

        let trades = JSON.parse(localStorage.getItem('forex_trades')) || [];
        let dailyGoal = parseFloat(localStorage.getItem('daily_profit_goal')) || 100;

        // --- Live Price Feed ---
        async function getLivePrice() {
            // Option 1: Alpha Vantage (requires key, limited for free tier)
            // const symbol = 'NASDAQ:NDAQ'; // Example: Nasdaq stock, not the index future directly
            // const url = `https://www.alphavantage.co/query?function=GLOBAL_QUOTE&symbol=${symbol}&apikey=${API_KEY_ALPHAVANTAGE}`;
            
            // Option 2: FinancialModelingPrep (requires key, limited free tier for real-time)
            const instrument = 'SPY'; // S&P 500 ETF, commonly tracks market. NAS100 equivalent index symbols vary by provider.
            const url = `https://financialmodelingprep.com/api/v3/quote/${instrument}?apikey=${API_KEY_FINANCIALMODELINGPREP}`;
            
            // Fallback for demo without API key:
            if (API_KEY_FINANCIALMODELINGPREP === 'YOUR_FMP_API_KEY' && API_KEY_ALPHAVANTAGE === 'YOUR_ALPHAVANTAGE_API_KEY') {
                document.getElementById('nas100-price').innerText = (Math.random() * (1000 - 900) + 900).toFixed(2); // Mock price
                document.getElementById('current-instrument').innerText = 'MOCK_INSTRUMENT';
                return;
            }

            try {
                const response = await fetch(url);
                const data = await response.json();
                if (data && data.length > 0 && data[0].price) {
                    document.getElementById('nas100-price').innerText = parseFloat(data[0].price).toFixed(2);
                    document.getElementById('current-instrument').innerText = data[0].symbol;
                } else if (data['Global Quote'] && data['Global Quote']['05. price']) { // Alpha Vantage
                    document.getElementById('nas100-price').innerText = parseFloat(data['Global Quote']['05. price']).toFixed(2);
                    document.getElementById('current-instrument').innerText = data['Global Quote']['01. symbol'];
                } else {
                    document.getElementById('nas100-price').innerText = 'N/A';
                    tg.showAlert("Failed to fetch price. Check API key/limits.");
                }
            } catch (error) {
                console.error("Error fetching live price:", error);
                document.getElementById('nas100-price').innerText = 'Error';
                tg.showAlert("Error fetching live price. Check console.");
            }
        }

        function startPriceRefresh() {
            clearInterval(priceRefreshInterval); // Clear any existing interval
            getLivePrice(); // Fetch immediately
            
            priceCountdown = REFRESH_INTERVAL_SECONDS;
            document.getElementById('price-countdown').innerText = priceCountdown;

            priceRefreshInterval = setInterval(() => {
                priceCountdown--;
                document.getElementById('price-countdown').innerText = priceCountdown;
                if (priceCountdown <= 0) {
                    getLivePrice();
                    priceCountdown = REFRESH_INTERVAL_SECONDS;
                    document.getElementById('price-countdown').innerText = priceCountdown;
                }
            }, 1000);
        }

        // --- Daily Goal Progress ---
        function updateDailyGoal() {
            const newGoal = parseFloat(document.getElementById('daily-goal-input').value);
            if (!isNaN(newGoal) && newGoal > 0) {
                dailyGoal = newGoal;
                localStorage.setItem('daily_profit_goal', dailyGoal);
                displayDailyProgress();
            } else {
                tg.showAlert("Please enter a valid daily goal.");
            }
        }

        function displayDailyProgress() {
            document.getElementById('daily-goal-input').value = dailyGoal;
            document.getElementById('current-goal').innerText = `$${dailyGoal}`;

            const today = new Date().toLocaleDateString();
            const todayTrades = trades.filter(trade => trade.date === today);
            const todayProfit = todayTrades.reduce((sum, trade) => sum + parseFloat(trade.result), 0);

            document.getElementById('today-profit').innerText = `$${todayProfit.toFixed(2)}`;

            const progressBar = document.getElementById('daily-progress-bar');
            let progressPercentage = (todayProfit / dailyGoal) * 100;
            if (progressPercentage < 0) progressPercentage = 0; // Don't show negative progress
            if (progressPercentage > 100 && todayProfit > 0) progressPercentage = 100; // Cap at 100% if goal reached
            
            progressBar.style.width = `${progressPercentage}%`;
            progressBar.style.backgroundColor = todayProfit >= dailyGoal ? '#4caf50' : (todayProfit < 0 ? '#f44336' : '#FFC107'); // Green, Red, Yellow
        }

        // --- Risk Calculator ---
        function calculateLotSize() {
            const balance = parseFloat(document.getElementById('account-balance').value);
            const riskPct = parseFloat(document.getElementById('risk-percentage').value) / 100;
            const stopLossPips = parseFloat(document.getElementById('stop-loss-pips').value);
            const pipValuePerLot = parseFloat(document.getElementById('pip-value-per-lot').value);

            if (isNaN(balance) || isNaN(riskPct) || isNaN(stopLossPips) || isNaN(pipValuePerLot) || 
                balance <= 0 || riskPct <= 0 || stopLossPips <= 0 || pipValuePerLot <= 0) {
                tg.showAlert("Please enter valid positive numbers for all risk calculator fields.");
                return;
            }

            const riskAmount = balance * riskPct;const lotSize = riskAmount / (stopLossPips * pipValuePerLot);

            document.getElementById('calculated-lot').innerText = lotSize.toFixed(2);
        }

        // --- TradingView Lightweight Charts (Mock Data) ---
        function initChart() {
            const chartOptions = {
                layout: {
                    background: { type: 'solid', color: tg.themeParams.bg_color || '#1a1a1a' },
                    textColor: tg.themeParams.text_color || '#f0f0f0',
                },
                grid: {
                    vertLines: { color: tg.themeParams.hint_color + '44' || '#77777744' }, // slight transparency
                    horzLines: { color: tg.themeParams.hint_color + '44' || '#77777744' },
                },
                rightPriceScale: {
                    borderColor: tg.themeParams.hint_color || '#777777',
                },
                timeScale: {
                    borderColor: tg.themeParams.hint_color || '#777777',
                },
                localization: {
                    locale: 'en-US',
                },
            };

            const chart = LightweightCharts.createChart(document.getElementById('chart-container'), chartOptions);
            chart.applyOptions({
                width: document.getElementById('chart-container').offsetWidth,
                height: document.getElementById('chart-container').offsetHeight,
            });

            // Handle resize for responsiveness (important for Telegram Mini Apps)
            window.addEventListener('resize', () => {
                chart.applyOptions({
                    width: document.getElementById('chart-container').offsetWidth,
                    height: document.getElementById('chart-container').offsetHeight,
                });
            });

            const series = chart.addAreaSeries({
                lineColor: '#2962FF',
                topColor: 'rgba(41, 98, 255, 0.28)',
                bottomColor: 'rgba(41, 98, 255, 0.05)',
            });

            // Mock Data for demonstration
            const data = [];
            let time = Date.UTC(2023, 10, 1, 0, 0, 0); // Start date (Nov 1, 2023)
            let value = 15000;
            for (let i = 0; i < 60; i++) { // 60 data points
                value += Math.random() * 50 - 25; // Random fluctuations
                data.push({ time: time / 1000, value: parseFloat(value.toFixed(2)) }); // Convert ms to seconds
                time += 24 * 60 * 60 * 1000; // Add one day
            }
            series.setData(data);
            chart.timeScale().fitContent(); // Zoom to fit data
        }

        // --- Trade Journal Functions ---
        function saveTrade() {
            const pairInput = document.getElementById('pair');
            const resultInput = document.getElementById('result');

            const pair = pairInput.value.trim();
            const result = parseFloat(resultInput.value);

            if (!pair || isNaN(result)) {
                tg.showAlert("Please enter a valid pair and numeric result.");
                return;
            }

            const newTrade = { 
                pair: pair.toUpperCase(), 
                result: result, 
                date: new Date().toLocaleDateString('en-US') 
            };
            trades.unshift(newTrade); // Add to the beginning of the array
            localStorage.setItem('forex_trades', JSON.stringify(trades));
            
            // Clear inputs
            pairInput.value = '';
            resultInput.value = '';
            
            displayTrades();
            displayDailyProgress(); // Update daily progress after saving a trade
            tg.showScanQrPopup({text: "Trade Logged!"}); 
            setTimeout(() => tg.closeScanQrPopup(), 1000);
        }
function displayTrades() {
            const container = document.getElementById('history');
            if (trades.length === 0) {
                container.innerHTML = `<p style="text-align: center; color: var(--hint);">No trades logged yet.</p>`;
                return;
            }
            container.innerHTML = trades.map(t => `
                <div class="trade-item">
                    <span><b>${t.pair}</b> <small style="color: var(--hint);">${t.date}</small></span>
                    <span class="${t.result >= 0 ? 'profit' : 'loss'}">
                        ${t.result >= 0 ? '+' : ''}${t.result.toFixed(2)}$
                    </span>
                </div>
            `).join('');
        }

        // --- Initial Load ---
        document.addEventListener('DOMContentLoaded', () => {
            displayTrades();
            displayDailyProgress();
            calculateLotSize(); // Calculate initial lot size
            startPriceRefresh(); // Start live price updates
            initChart(); // Initialize the chart
        });
    </script>
</body>
</html>
