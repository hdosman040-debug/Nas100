<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strategy Master</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: var(--tg-theme-bg-color, #1a1a1a);
            --text: var(--tg-theme-text-color, #ffffff);
            --secondary: var(--tg-theme-secondary-bg-color, #252525);
            --btn: var(--tg-theme-button-color, #2481cc);
            --btn-text: var(--tg-theme-button-text-color, #ffffff);
            --hint: var(--tg-theme-hint-color, #aaaaaa);
            --glow-fx: #00ffcc;
            --glow-nas: #ff007f;
            --bullish-green: #4caf50;
            --bearish-red: #f44336;
        }

        body { 
            font-family: sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            margin: 0; 
            padding: 15px; 
            padding-bottom: 80px; 
        }

        .hidden { display: none !important; }

        /* Splash / Main Menu Interface */
        #main-menu {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
            text-align: center;
        }
        .welcome-text {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--hint);
            margin-bottom: 5px;
        }
        .app-title {
            font-size: 26px;
            font-weight: bold;
            margin: 0 0 40px 0;
            color: #ffffff;
            letter-spacing: 1px;
        }
        
        .menu-grid {
            display: flex;
            flex-direction: column;
            gap: 25px;
            width: 85%;
            max-width: 300px;
        }
        .glow-btn {
            padding: 20px;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 16px;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #ffffff;
            background: #222222;
        }
        .btn-fx {
            border: 2px solid var(--glow-fx);
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.2);
        }
        .btn-fx:active {
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.6);
            transform: scale(0.98);
        }
        .btn-nas {
            border: 2px solid var(--glow-nas);
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.2);
        }
        .btn-nas:active {
            box-shadow: 0 0 25px rgba(255, 0, 127, 0.6);
            transform: scale(0.98);
        }

        /* Journal Layout Headers */
        .journal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .back-btn {
            background: var(--secondary);
            color: var(--text);
            border: 1px solid #444;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
        }

        /* Form Area */
        .card { background: var(--secondary); padding: 15px; border-radius: 12px; margin-bottom: 15px; }
        label { display: block; font-size: 12px; color: var(--hint); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        input, textarea, select { 
            width: 100%; background: var(--bg); border: 1px solid #444; 
            color: var(--text); padding: 11px; border-radius: 8px; 
            margin-bottom: 15px; box-sizing: border-box; font-size: 14px;
        }

        /* Long / Short Selector Switches */
        .direction-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .dir-btn {
            background: var(--bg); border: 1px solid #444; padding: 12px;
            border-radius: 8px; text-align: center; font-weight: bold; font-size: 14px;
            cursor: pointer; color: var(--hint); transition: 0.2s;
        }
        .dir-btn.active-long { border-color: var(--bullish-green); color: var(--bullish-green); background: rgba(76, 175, 80, 0.1); }
        .dir-btn.active-short { border-color: var(--bearish-red); color: var(--bearish-red); background: rgba(244, 67, 54, 0.1); }

        /* Checklist Styling */
        .checklist-container { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
        .check-item { 
            display: flex; align-items: center; background: var(--bg); 
            padding: 12px; border-radius: 8px; border: 1px solid #333; 
            cursor: pointer;
        }
        .check-item input { width: auto; margin: 0 12px 0 0; transform: scale(1.2); }
        .check-item span { font-size: 13px; }

        /* Image Upload and Remove Components */
        .upload-area { 
            border: 2px dashed var(--hint); padding: 20px; 
            text-align: center; border-radius: 12px; margin-bottom: 15px; 
            cursor: pointer;
        }
        .preview-container { position: relative; display: none; margin-top: 10px; }
        .image-preview-el { width: 100%; border-radius: 8px; display: block; }
        .remove-img-btn {
            position: absolute; top: 10px; right: 10px; background: rgba(244, 67, 54, 0.9);
            color: white; border: none; padding: 6px 12px; border-radius: 6px;
            font-size: 11px; font-weight: bold; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        .btn-main { 
            background: var(--btn); color: var(--btn-text); border: none; 
            width: 100%; padding: 15px; border-radius: 12px; font-weight: bold; 
            cursor: pointer; font-size: 14px; text-transform: uppercase;
        }

        /* Journal Feed Styling */   
        .journal-entry { background: var(--secondary); border-radius: 12px; overflow: hidden; margin-bottom: 20px; border: 1px solid #333; }
        .journal-img { width: 100%; display: block; background: #000; }
        .journal-info { padding: 15px; }
        
        .tag { font-size: 11px; padding: 4px 10px; border-radius: 6px; background: #333; margin-bottom: 8px; display: inline-block; font-weight: bold; color: #fff;}
        .dir-tag { font-size: 11px; padding: 4px 10px; border-radius: 6px; margin-bottom: 8px; display: inline-block; font-weight: bold; color: #fff; margin-left: 5px; }
        .dir-tag.long { background: var(--bullish-green); }
        .dir-tag.short { background: var(--bearish-red); }
        
        .entry-date { float: right; font-size: 12px; color: var(--hint); margin-top: 4px; }

        /* Colored notes setup */
        .notes-display { margin: 8px 0 12px 0; font-size:14px; line-height:1.4; color: var(--bullish-green); font-weight: 500; }

        .conf-badge-container { display: flex; flex-wrap: wrap; gap: 5px; margin: 10px 0; }
        .conf-badge { font-size: 11px; padding: 2px 6px; border-radius: 4px; background: rgba(255,255,255,0.05); color: #bbb; border: 1px solid #444; }

        /* Conditional colors for metrics text */
        .pnl-pos { color: var(--bullish-green); font-weight: bold; }
        .pnl-neg { color: var(--bearish-red); font-weight: bold; }
    </style>
</head>
<body>

    <!-- SCREEN 1: SPLASH LANDING MAIN MENU -->
    <div id="main-menu">
        <div class="welcome-text">Welcome to your passion</div>
        <h1 class="app-title">STRATEGY MASTER</h1>
        
        <div class="menu-grid">
            <button class="glow-btn btn-fx" onclick="openJournal('Forex')">💱 FX Journal</button>
            <button class="glow-btn btn-nas" onclick="openJournal('NASDAQ')">📈 NASDAQ Journal</button>
        </div>
    </div>

    <!-- SCREEN 2: JOURNAL INTERFACE -->
    <div id="journal-screen" class="hidden">
        <div class="journal-header">
            <h2 id="journal-title" style="margin:0; font-size:20px; letter-spacing: 0.5px;">JOURNAL</h2>
            <button class="back-btn" onclick="showMainMenu()">⬅ Main Menu</button>
        </div>

        <div class="card">
            <label>Select Asset / Pair</label>
            <select id="asset-selector"></select>

            <label>Trade Bias / Direction</label>
            <div class="direction-grid">
                <div id="dir-long" class="dir-btn active-long" onclick="setDirection('LONG')">🟢 LONG</div>
                <div id="dir-short" class="dir-btn" onclick="setDirection('SHORT')">🔴 SHORT</div>
            </div>

            <label>Confluence Checklist</label>
            <div class="checklist-container">
                <label class="check-item">
                    <input type="checkbox" id="conf-liquidity">
                    <span id="liq-label">Sell-Side Liquidity (SSL) Sweep</span>
                </label>
                <label class="check-item">
                    <input type="checkbox" id="conf-zone">
                    <span id="zone-label">Discount Matrix Entry Zone</span>
                </label>
                <label class="check-item">
                    <input type="checkbox" id="conf-mss">
                    <span>Market Structure Shift (MSS)</span>
                </label>
                <label class="check-item">
                    <input type="checkbox" id="conf-fvg">
                    <span>Fair Value Gap (FVG) / Displacement</span>
                </label>
                <label class="check-item">
                    <input type="checkbox" id="conf-smt">
                    <span>SMT Divergence Identification</span>
                </label>
            </div>

            <label>Setup Description / Notes</label>
            <textarea id="notes" rows="2" placeholder="Why did you take this trade?"></textarea>

            <label>Result ($ Profit or Loss)</label>
            <input type="number" id="result" placeholder="e.g. 150 or -50">

            <label>Chart Screenshot</label>
            <div class="upload-area" id="upload-box" onclick="document.getElementById('file-input').click()">
                <span id="upload-text">📸 Tap to upload analysis</span>
                <input type="file" id="file-input" accept="image/*" style="display:none" onchange="previewImage(this)">
            </div>
            
            <div class="preview-container" id="p-container">
                <button class="remove-img-btn" onclick="clearUploadedImage(event)">❌ Remove / Replace</button>
                <img id="image-preview" class="image-preview-el" src="" alt="Preview">
            </div>

            <button class="btn-main" style="margin-top:15px;" onclick="saveEntry()">LOG ANALYSIS</button>
        </div>

        <h3>Previous Trades</h3>
        <div id="journal-list"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let currentView = ''; 
        let tradeDirection = 'LONG'; // Default dynamic assignment
        let selectedImageBase64 = null;
        let db;

        const forexPairs = ['EURUSD', 'GBPUSD', 'AUDCAD'];
        const nasdaqPairs = ['NAS100'];

        // --- IndexedDB Setup ---
        const request = indexedDB.open("StrategyDB", 1);
        request.onupgradeneeded = e => {
            db = e.target.result;
            db.createObjectStore("entries", { keyPath: "id", autoIncrement: true });
        };
        request.onsuccess = e => {
            db = e.target.result;
        };

        // --- Direction Control Switcher (Dynamic checklist modifications) ---
        function setDirection(dir) {
            tradeDirection = dir;
            const longBtn = document.getElementById('dir-long');
            const shortBtn = document.getElementById('dir-short');
            const liqText = document.getElementById('liq-label');
            const zoneText = document.getElementById('zone-label');

            if (dir === 'LONG') {
                longBtn.classList.add('active-long');
                shortBtn.classList.remove('active-short');
                liqText.innerText = "Sell-Side Liquidity (SSL) Sweep";
                zoneText.innerText = "Discount Matrix Entry Zone";
            } else {
                longBtn.classList.remove('active-long');
                shortBtn.classList.add('active-short');
                liqText.innerText = "Buy-Side Liquidity (BSL) Sweep";
                zoneText.innerText = "Premium Matrix Entry Zone";
            }
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
        }

        function openJournal(mode) {
            currentView = mode;
            document.getElementById('main-menu').classList.add('hidden');
            document.getElementById('journal-screen').classList.remove('hidden');
            
            document.getElementById('journal-title').innerText = mode === 'Forex' ? '💱 FX WORKSPACE' : '📈 NASDAQ WORKSPACE';
            document.getElementById('journal-title').style.color = mode === 'Forex' ? 'var(--glow-fx)' : 'var(--glow-nas)';

            const selector = document.getElementById('asset-selector');
            const targetPairs = mode === 'Forex' ? forexPairs : nasdaqPairs;
            selector.innerHTML = targetPairs.map(p => `<option value="${p}">${p}</option>`).join('');

            setDirection('LONG'); // Reset selection state on load
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
            displayEntries();
        }

        function showMainMenu() {
            document.getElementById('journal-screen').classList.add('hidden');
            document.getElementById('main-menu').classList.remove('hidden');
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
        }

        // --- Image Handler Actions ---
        function previewImage(input) {
            const file = input.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                selectedImageBase64 = e.target.result;
                document.getElementById('image-preview').src = selectedImageBase64;
                document.getElementById('p-container').style.display = 'block';
                document.getElementById('upload-box').style.display = 'none';
            }
            reader.readAsDataURL(file);
        }

        function clearUploadedImage(event) {
            if(event) event.stopPropagation(); // Stop click pass-through
            selectedImageBase64 = null;
            document.getElementById('image-preview').src = '';
            document.getElementById('p-container').style.display = 'none';
            document.getElementById('upload-box').style.display = 'block';
            document.getElementById('file-input').value = ''; // Flush upload instance data
        }

        // --- Core Execution Layer ---
        function saveEntry() {
            const assetSelected = document.getElementById('asset-selector').value;
            const notes = document.getElementById('notes').value;
            const result = document.getElementById('result').value;

            if (!selectedImageBase64 || !result) {
                tg.showAlert("Please add a screenshot and a result execution payload!");
                return;
            }

            const confluences = {
                liquidity: document.getElementById('conf-liquidity').checked,
                zone: document.getElementById('conf-zone').checked,
                mss: document.getElementById('conf-mss').checked,
                fvg: document.getElementById('conf-fvg').checked,
                smt: document.getElementById('conf-smt').checked,
                liqType: tradeDirection === 'LONG' ? 'SSL Sweep' : 'BSL Sweep',
                zoneType: tradeDirection === 'LONG' ? 'Discount Zone' : 'Premium Zone'
            };

            const entry = {
                viewGroup: currentView, 
                asset: assetSelected,
                direction: tradeDirection,
                confluences: confluences,
                notes: notes,
                result: parseFloat(result),
                image: selectedImageBase64,
                date: new Date().toLocaleDateString()
            };

            const transaction = db.transaction(["entries"], "readwrite");
            transaction.objectStore("entries").add(entry);

            transaction.oncomplete = () => {
                // Wipe form components clean
                document.getElementById('notes').value = '';
                document.getElementById('result').value = '';
                clearUploadedImage(null);
                
                document.getElementById('conf-liquidity').checked = false;
                document.getElementById('conf-zone').checked = false;
                document.getElementById('conf-mss').checked = false;
                document.getElementById('conf-fvg').checked = false;
                document.getElementById('conf-smt').checked = false;

                tg.showPopup({
                    title: 'Trade Logged!',
                    message: 'Execution metrics parsed into offline structural storage.',
                    buttons: [{type: 'ok'}]
                });

                displayEntries();
            };
        }

        function displayEntries() {
            const container = document.getElementById('journal-list');
            if (!db) return;

            const transaction = db.transaction(["entries"], "readonly");
            const store = transaction.objectStore("entries");

            store.getAll().onsuccess = e => {
                const entries = e.target.result
                    .filter(item => item.viewGroup === currentView)
                    .reverse(); 
                
                if (entries.length === 0) {
                    container.innerHTML = `<p style="text-align:center; color:var(--hint); font-size:14px; padding: 20px 0;">No saved ${currentView} executions detected here.</p>`;
                    return;
                }

                container.innerHTML = entries.map(entry => {
                    let badgesHtml = '';
                    if (entry.confluences) {
                        if (entry.confluences.liquidity) badgesHtml += `<span class="conf-badge">🎯 ${entry.confluences.liqType || 'Liq Sweep'}</span>`;
                        if (entry.confluences.zone) badgesHtml += `<span class="conf-badge">💎 ${entry.confluences.zoneType || 'Matrix Zone'}</span>`;
                        if (entry.confluences.mss) badgesHtml += '<span class="conf-badge">📉 MSS</span>';
                        if (entry.confluences.fvg) badgesHtml += '<span class="conf-badge">⚡ FVG</span>';
                        if (entry.confluences.smt) badgesHtml += '<span class="conf-badge">🔀 SMT</span>';
                    }

                    const isWin = entry.result >= 0;

                    return `
                        <div class="journal-entry">
                            <div class="journal-info">
                                <span class="tag" style="border: 1px solid ${currentView === 'Forex' ? 'var(--glow-fx)' : 'var(--glow-nas)'}">${entry.asset}</span>
                                <span class="dir-tag ${entry.direction === 'LONG' ? 'long' : 'short'}">${entry.direction}</span>
                                <span class="entry-date">${entry.date}</span>
                                
                                <!-- Description Note rendered in pure Green above chart screenshot -->
                                <div class="notes-display">
                                    ${entry.notes ? entry.notes : '<em>No strategic note details saved.</em>'}
                                </div>

                                <div class="conf-badge-container">
                                    ${badgesHtml || '<span class="conf-badge" style="color:var(--hint)">No formal confluences selected</span>'}
                                </div>
                                
                                <div class="${isWin ? 'pnl-pos' : 'pnl-neg'}" style="margin-top:5px; font-size: 16px;">
                                    ${isWin ? '+$' : '-$'}${Math.abs(entry.result)}
                                </div>
                            </div>
                            <img src="${entry.image}" class="journal-img" alt="Chart Execution Metrics">
                        </div>
                    `;
                }).join('');
            };
        }
    </script>
</body>
</html>
