<!DOCTYPE html>
<html lang="en">k
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strategy Master</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: var(--tg-theme-bg-color, #1a1a1a);
            --text: var(--tg-theme-text-color, #ffffff);
            --secondary: var(--tg-theme-secondary-bg-color, #252525);
            --btn: var(--tg-theme-button-color, #2481cc);
            --btn-text: var(--tg-theme-button-text-color, #ffffff);
            --hint: var(--tg-theme-hint-color, #aaaaaa);
        }

        body { font-family: sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 15px; padding-bottom: 80px; }
        
        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { font-size: 20px; margin: 0; color: var(--btn); }

        /* Category Selector */
        .category-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .cat-btn { 
            background: var(--secondary); border: 2px solid transparent; 
            padding: 20px 10px; border-radius: 12px; text-align: center; 
            cursor: pointer; transition: 0.3s;
        }
        .cat-btn.active { border-color: var(--btn); background: rgba(36, 129, 204, 0.1); }
        .cat-btn span { display: block; font-size: 24px; margin-bottom: 5px; }

        /* Form Area */
        .card { background: var(--secondary); padding: 15px; border-radius: 12px; margin-bottom: 15px; }
        label { display: block; font-size: 12px; color: var(--hint); margin-bottom: 5px; }
        input, textarea { 
            width: 100%; background: var(--bg); border: 1px solid #444; 
            color: var(--text); padding: 10px; border-radius: 8px; 
            margin-bottom: 15px; box-sizing: border-box; 
        }

        /* Image Upload Styling */
        .upload-area { 
            border: 2px dashed var(--hint); padding: 20px; 
            text-align: center; border-radius: 12px; margin-bottom: 15px; 
        }
        #image-preview { width: 100%; border-radius: 8px; display: none; margin-top: 10px; }

        .btn-main { 
            background: var(--btn); color: var(--btn-text); border: none; 
            width: 100%; padding: 15px; border-radius: 12px; font-weight: bold; 
        }

        /* Journal List */   


        .journal-entry { background: var(--secondary); border-radius: 12px; overflow: hidden; margin-bottom: 20px; }
        .journal-img { width: 100%; display: block; background: #000; }
        .journal-info { padding: 15px; }
        .tag { font-size: 10px; padding: 3px 8px; border-radius: 4px; background: var(--btn); margin-bottom: 5px; display: inline-block; }
        .entry-date { float: right; font-size: 12px; color: var(--hint); }
        
        .pnl-pos { color: #4caf50; font-weight: bold; }
        .pnl-neg { color: #f44336; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">
        <h1>STRATEGY MASTER</h1>
        <p style="font-size: 12px; color: var(--hint);">Analyze. Execute. Win.</p>
    </div>

    <!-- Category Selector -->
    <div class="category-grid">
        <div class="cat-btn active" id="btn-forex" onclick="setCategory('Forex')">
            <span>💱</span> Forex Pairs
        </div>
        <div class="cat-btn" id="btn-nas" onclick="setCategory('NAS100')">
            <span>📈</span> NAS100
        </div>
    </div>

    <!-- Entry Form -->
    <div class="card">
        <label>Setup Description / Notes</label>
        <textarea id="notes" rows="2" placeholder="Why did you take this trade?"></textarea>

        <label>Result ($ Profit or Loss)</label>
        <input type="number" id="result" placeholder="e.g. 150 or -50">

        <label>Chart Screenshot</label>
        <div class="upload-area" onclick="document.getElementById('file-input').click()">
            <span id="upload-text">📸 Tap to upload analysis</span>
            <input type="file" id="file-input" accept="image/*" style="display:none" onchange="previewImage(this)">
            <img id="image-preview" src="">
        </div>

        <button class="btn-main" onclick="saveEntry()">LOG ANALYSIS</button>
    </div>

    <h3>Past Sessions</h3>
    <div id="journal-list">
        <!-- Entries appear here -->
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let currentCategory = 'Forex';
        let selectedImageBase64 = null;

        function setCategory(cat) {
            currentCategory = cat; document.getElementById('btn-forex').classList.toggle('active', cat === 'Forex');
            document.getElementById('btn-nas').classList.toggle('active', cat === 'NAS100');
            tg.HapticFeedback.impactOccurred('light');
        }

        function previewImage(input) {
            const file = input.files[0];
            const reader = new FileReader();
            reader.onload = function(e) {
                selectedImageBase64 = e.target.result;
                const preview = document.getElementById('image-preview');
                preview.src = selectedImageBase64;
                preview.style.display = 'block';
                document.getElementById('upload-text').style.display = 'none';
            }
            reader.readAsDataURL(file);
        }

        // --- IndexedDB Logic (To save images locally) ---
        let db;
        const request = indexedDB.open("StrategyDB", 1);
        request.onupgradeneeded = e => {
            db = e.target.result;
            db.createObjectStore("entries", { keyPath: "id", autoIncrement: true });
        };
        request.onsuccess = e => {
            db = e.target.result;
            displayEntries();
        };

        function saveEntry() {
            const notes = document.getElementById('notes').value;
            const result = document.getElementById('result').value;

            if (!selectedImageBase64 || !result) {
                tg.showAlert("Please add a screenshot and a result!");
                return;

            }

            const entry = {
                category: currentCategory,
                notes: notes,
                result: parseFloat(result),
                image: selectedImageBase64,
                date: new Date().toLocaleDateString()
            };

            const transaction = db.transaction(["entries"], "readwrite");
            transaction.objectStore("entries").add(entry);
            
            transaction.oncomplete = () => {
                tg.showScanQrPopup({text: "Logged!"});
                setTimeout(() => {
                    tg.closeScanQrPopup();
                    location.reload(); // Refresh to show new entry
                }, 1000);
            };
        }

        function displayEntries() {
            const container = document.getElementById('journal-list');
            const transaction = db.transaction(["entries"], "readonly");
            const store = transaction.objectStore("entries");
            
            store.getAll().onsuccess = e => {
                const entries = e.target.result.reverse(); // Newest first
                container.innerHTML = entries.map(entry => `
                    <div class="journal-entry">
                        <img src="${entry.image}" class="journal-img">
                        <div class="journal-info">
                            <span class="tag">${entry.category}</span>
                            <span class="entry-date">${entry.date}</span>
                            <div style="margin-top:10px;">${entry.notes}</div>
                            <div class="${entry.result >= 0 ? 'pnl-pos' : 'pnl-neg'}" style="margin-top:10px; font-size: 18px;">
                                ${entry.result >= 0 ? '+$' : '-$'}${Math.abs(entry.result)}
                            </div>
                        </div>
                    </div>
                `).join('');
            };
        }
    </script>
</body>
</html>
