<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forex Journal</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: var(--tg-theme-bg-color, #ffffff);
            --text: var(--tg-theme-text-color, #000000);
            --hint: var(--tg-theme-hint-color, #999999);
            --btn: var(--tg-theme-button-color, #2481cc);
            --btn-text: var(--tg-theme-button-text-color, #ffffff);
        }
        body { font-family: sans-serif; background: var(--bg); color: var(--text); padding: 20px; margin: 0; }
        .card { background: rgba(128, 128, 128, 0.1); padding: 15px; border-radius: 12px; margin-bottom: 20px; }
        input, select { width: 100%; padding: 10px; margin: 5px 0 15px; border-radius: 8px; border: 1px solid var(--hint); background: var(--bg); color: var(--text); box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: var(--btn); color: var(--btn-text); border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .trade-item { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid var(--hint); }
        .profit { color: #4caf50; }
        .loss { color: #f44336; }
    </style>
</head>
<body>

    <h3>📈 New Trade</h3>
    <div class="card">
        <label>Pair</label>
        <input type="text" id="pair" placeholder="e.g. NAS100 or EURUSD">
        
        <label>Result ($)</label>
        <input type="number" id="result" placeholder="e.g. 50 or -20">
        
        <button onclick="saveTrade()">Log Trade</button>
    </div>

    <h3>📜 History</h3>
    <div id="history"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Load trades from local storage on start
        let trades = JSON.parse(localStorage.getItem('forex_trades')) || [];
        displayTrades();

        function saveTrade() {
            const pair = document.getElementById('pair').value;
            const result = document.getElementById('result').value;

            if (!pair || !result) return tg.showAlert("Please fill all fields");

            const newTrade = { pair, result, date: new Date().toLocaleDateString() };
            trades.unshift(newTrade); // Add to start of list
            localStorage.setItem('forex_trades', JSON.stringify(trades));
            
            // Clear inputs
            document.getElementById('pair').value = '';
            document.getElementById('result').value = '';
            
            displayTrades();
            tg.showScanQrPopup({text: "Trade Logged!"}); // Fun little visual feedback
            setTimeout(() => tg.closeScanQrPopup(), 1000);
        }

        function displayTrades() {
            const container = document.getElementById('history');
            container.innerHTML = trades.map(t => `
                <div class="trade-item">
                    <span><b>${t.pair}</b> <small>${t.date}</small></span>
                    <span class="${t.result >= 0 ? 'profit' : 'loss'}">
                        ${t.result >= 0 ? '+' : ''}${t.result}$
                    </span>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
