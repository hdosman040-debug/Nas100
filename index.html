<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NAS100 Analysis</title>
    <!-- 1. The Telegram Web App Script -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: sans-serif;
            background-color: var(--tg-theme-bg-color, #1a1a1a);
            color: var(--tg-theme-text-color, #ffffff);
            text-align: center;
            padding: 20px;
        }
        .chart-placeholder {
            width: 100%;
            height: 200px;
            background: #2c2c2c;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            border: 1px solid #444;
        }
        button {
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h2>NAS100 Analysis App</h2>
    <div class="chart-placeholder">
        <!-- You can later embed a TradingView widget here -->
        <p>📊 [NAS100 Chart Area]</p>
    </div>
    
    <div id="user-info"></div>
    <br>
    <button onclick="Telegram.WebApp.close()">Close App</button>

    <script>
        // Initialize the Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand(); // Opens the app to full height

        // Display user name if available
        if (tg.initDataUnsafe.user) {
            document.getElementById('user-info').innerText = 
                "Welcome, " + tg.initDataUnsafe.user.first_name + "!";
        }
    </script>
</body>
</html>
